name: CAVACH CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 backend/evaluate.py
      - run: python3 backend/pipeline.py --check
      - run: python3 backend/eval_dataset.py
      - run: python3 backend/adversarial.py
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Secret scan (built bundle + repo)
        run: |
          ! grep -rE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY" frontend/dist/ backend/ supabase/ || true
          grep -rE "sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}" frontend/dist/ && exit 1 || echo "bundle clean"
